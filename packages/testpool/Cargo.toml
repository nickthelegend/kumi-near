[package]
name = "kumi-testpool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Testnet-only NEP-141 token with a built-in NEAR constant-product pool"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"
primitive-types = { version = "0.12", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }
